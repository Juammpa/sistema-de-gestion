<!-- Boton Volver -->
<back-button />

<section
  class="m-5 rounded-2xl border border-[#2a3247] bg-[#161c2e] p-6 shadow-[0_8px_40px_-12px_rgba(0,0,0,0.6)]"
>
  <div class="flex flex-wrap items-start justify-between gap-6">
    <!-- Informacion cliente -->
    <div class="min-w-0 flex flex-col gap-1">
      <!-- Nombre y Apellido -->
      <h1 class="text-2xl font-bold tracking-tight text-slate-100 sm:text-3xl">
        {{ client().lastName }} {{ client().name }}
      </h1>
      <!-- Boton WhatsApp -->
      <whatsapp-button [phoneNumber]="client().phoneNumber" />
      <!-- Boton agregar sucursal (siempre visible) -->
      <button
        class="self-start inline-flex mt-2 item-center gap-2 cursor-pointer rounded-xl border border-dashed border-[#2a3247] bg-transparent px-4 py-2 text-sm font-medium text-slate-400 transition hover:border-slate-500 hover:text-slate-200"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 5v14M5 12h14" />
        </svg>
        Agregar sucursal
      </button>
    </div>
  </div>
</section>
