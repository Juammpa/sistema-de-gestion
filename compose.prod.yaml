services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    # Sin "ports": la base solo es accesible desde la red interna de Docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    restart: unless-stopped
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # URL publica con la que los usuarios ven keycloak
      KC_HOSTNAME: https://${AUTH_DOMAIN}
      # El HTTPS lo termina Caddy, Keycloak recibe HTTP interno y confia en los headers X-Forwarded-*
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # Admin inicial: solo se crea la primera vez
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      BACKEND_ADMIN_SECRET: ${BACKEND_ADMIN_SECRET}
    volumes:
      - ./infra/keycloak/sistema-gestion-realm.json:/opt/keycloak/data/import/sistema-gestion-realm.json:ro
      - ./infra/keycloak/themes/sistema-gestion:/opt/keycloak/themes/sistema-gestion:ro
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # Evita el perfil "local" por defecto (no existe application-local.yaml en la imagen)
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Debe coincidir con el "iss" de los tokens: la URL publica de Keycloak
      KEYCLOAK_ISSUER_URI: https://${AUTH_DOMAIN}/realms/sistema-gestion
      # El backend habla con Keycloak por la red interna
      KEYCLOAK_BASE_URL: http://keycloak:8080
      BACKEND_ADMIN_SECRET: ${BACKEND_ADMIN_SECRET}
      CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN}
      INITIAL_OWNER_ID: ${INITIAL_OWNER_ID}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  frontend:
    build: ./frontend
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      AUTH_DOMAIN: ${AUTH_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./infra/caddy/CaddyFile:/etc/caddy/CaddyFile:ro
      # Aca guarda los certificados: si se pierde, vuelve a pedirlos y Let's Encrypt limita los pedidos
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
      - keycloak

volumes:
  postgres_data:
  caddy_data:
  caddy_config: