<!-- Backdrop: cierra al hacer click fuera del panel -->
<div
  (click)="close()"
  class="fixed inset-0 z-50 flex items-center justify-center bg-[#070b14]/10 p-4 backdrop-blur-sm"
>
  <!-- Panel: stopPropagation evita que el click interno llegue al backdrop -->
  <div
    (click)="$event.stopPropagation()"
    class="w-full max-w-lg overflow-hidden rounded-2xl border border-slate-700/60 bg-[#151d2e] shadow-2xl shadow-black/60 ring-1 ring-white/5"
  >
    <!-- ====== HEADER ====== -->
    <div class="flex items-start justify-between gap-4 border-b border-slate-700/50 px-7 py-5">
      <div class="flex items-center gap-3">
        <!-- Badge con ícono -->
        <span
          class="flex h-10 w-10 items-center justify-center rounded-xl bg-blue-600/15 text-blue-400"
        >
          <i class="fa-solid fa-tag"></i>
        </span>
        <div>
          <h2 class="text-lg font-bold tracking-tight text-white">Editar Pago</h2>
          <p class="mt-0.5 text-xs text-slate-400">Detalles del pago</p>
        </div>
      </div>

      <!-- Botón cerrar -->
      <button
        type="button"
        (click)="close()"
        class="rounded-lg p-1.5 cursor-pointer text-slate-400 transition-colors hover:bg-slate-700/60 hover:text-white"
      >
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <!-- ====== BODY (form) ====== -->
    <form [formGroup]="paymentForm" (ngSubmit)="onSave()" class="space-y-5 px-7 py-6">
      <!-- Fecha-->
      <div class="space-y-1 5">
        <label class="block text-xs font-medium text-slate-300">Fecha</label>
        <input
          type="date"
          formControlName="date"
          [class.!border-red-500]="formUtils.isValidField(paymentForm, 'date')"
          class="w-full rounded-xl border border-slate-700 bg-[#0f1626] px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 outline-none transition-colors focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
        />
      </div>

      <!-- Grid: TipoCorte y Unidades -->
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <!-- Tipo Corte -->
        <div class="space-y-1.5">
          <label class="block text-xs font-medium text-slate-300">Método de Pago</label>
          <select
            formControlName="paymentType"
            [value]="paymentForm.controls['paymentType']"
            class="w-full rounded-xl border border-slate-700 bg-[#0f1626] px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 shadow-inner outline-none transition-colors focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
          >
            <!-- Opcion placeholder: value null obliga a elegir -->
            <option [ngValue]="null" disabled>Seleccionar método...</option>
            @for (option of paymentTypeOptions; track option.value) {
              <option [ngValue]="option.value">
                {{ option.label }}
              </option>
            }
          </select>
          @if (formUtils.isValidField(paymentForm, 'paymentType')) {
            <span class="flex items-center gap-1 text-xs text-red-400">
              <i class="fa-solid fa-triangle-exclamation"></i>
              {{ formUtils.getFieldError(paymentForm, 'paymentType') }}
            </span>
          }
        </div>

        <!-- Monto -->
        <div class="space-y-1.5">
          <label class="block text-xs font-medium text-slate-300">Monto</label>
          <input
            type="text"
            [value]="paymentForm.controls['amount']"
            formControlName="amount"
            placeholder="Ej. 10000"
            [class.!border-red-500]="formUtils.isValidField(paymentForm, 'amount')"
            class="w-full rounded-xl border border-slate-700 bg-[#0f1626] px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 shadow-inner outline-none transition-colors focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
          />
          <!-- Mostrar error descriptivo -->
          @if (formUtils.isValidField(paymentForm, 'amount')) {
            <span class="flex items-center gap-1 text-xs text-red-400">
              <i class="fa-solid fa-triangle-exclamation"></i>
              {{ formUtils.getFieldError(paymentForm, 'amount') }}
            </span>
          }
        </div>
      </div>

      <!-- ====== FOOTER ====== -->
      <!-- Eliminar a la izquierda, Cancelar/Guardar a la derecha -->
      <div class="mt-6 flex items-center justify-end gap-3 border-t border-slate-700/50 pt-5">
        <button
          type="button"
          (click)="showDeleteConfirm.set(true)"
          class="inline-flex cursor-pointer items-center gap-1.5 rounded-xl border border-red-500/30 bg-red-500/10 px-4 py-2.5 text-xs font-semibold text-red-400 transition-colors hover:border-red-700 hover:text-red-300"
        >
          <i class="fa-solid fa-trash-can"></i>
          Eliminar
        </button>

        <div class="flex items-center gap-3">
          <button
            type="button"
            (click)="close()"
            class="cursor-pointer rounded-xl border border-slate-600/70 px-4 py-2.5 text-xs font-semibold text-slate-300 transition-colors hover:bg-slate-700/50 hover:text-white"
          >
            Cancelar
          </button>
          <button
            type="submit"
            [disabled]="paymentForm.invalid"
            class="inline-flex cursor-pointer items-center gap-2 rounded-xl bg-blue-600 px-5 py-2.5 text-xs font-semibold text-white transition-colors hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/60 disabled:cursor-not-allowed disabled:opacity-40 disabled:shadow-none"
          >
            <i class="fa-solid fa-check"></i>
            <span>Guardar cambios</span>
          </button>
        </div>
      </div>
    </form>
  </div>
</div>

@if (showDeleteConfirm()) {
  <delete-modal
    description="Eliminar pago"
    entityType="El pago"
    [entityName]="translatePaymentType(payment().paymentType) + ' - $' + payment().amount"
    [loading]="deleting()"
    (cancel)="showDeleteConfirm.set(false)"
    (confirm)="onDelete()"
  />
}
