spring:
  application:
    name: backend
  profiles:
    default: local
  jackson:
    generator:
      write-bigdecimal-as-plain: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          audiences: sistema-gestion-api
      client:
        registration:
          keycloak-admin:
            provider: keycloak
            client-id: backend-admin
            client-secret: ${BACKEND_ADMIN_SECRET}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${app.keycloak.base-url}/realms/${app.keycloak.realm}/protocol/openid-connect/token

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    placeholders:
      initial_owner_id: ${INITIAL_OWNER_ID}

server:
  port: 8080

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  keycloak:
    base-url: ${KEYCLOAK_BASE_URL}
    realm: sistema-gestion
