<div class="flex gap-2">
  <!-- Input + botón buscar integrados -->
  <div
    class="flex h-11 flex-1 overflow-hidden rounded-xl border border-slate-700/70 bg-canvas transition-all duration-150 hover:border-slate-600 focus-within:border-blue-500 focus-within:ring-4 focus-within:ring-blue-500/15 motion-reduce:transition-none"
  >
    <input
      #searchBox
      type="search"
      [placeholder]="placeholder()"
      (input)="onSearch($event)"
      aria-label="Buscar"
      autocomplete="off"
      spellcheck="false"
      enterkeyhint="search"
      class="min-w-0 flex-1 bg-transparent px-4 text-base text-slate-100 outline-none placeholder:text-slate-400 sm:text-sm"
    />
    <button
      type="button"
      (click)="searchBox.focus()"
      title="Buscar"
      aria-label="Buscar"
      class="flex w-11 shrink-0 cursor-pointer touch-manipulation items-center justify-center border-l border-slate-700/70 text-slate-400 transition-colors duration-150 hover:bg-slate-800 hover:text-slate-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-blue-400/70 active:bg-slate-700 motion-reduce:transition-none"
    >
      <svg
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        class="h-4 w-4"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"
        />
      </svg>
    </button>
  </div>

  <button
    type="button"
    (click)="add.emit()"
    class="inline-flex h-11 shrink-0 cursor-pointer touch-manipulation items-center justify-center gap-2 whitespace-nowrap rounded-xl bg-blue-600 px-4 text-sm font-semibold text-white shadow-lg shadow-blue-600/20 transition-all duration-150 hover:bg-blue-500 hover:shadow-blue-600/30 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-300/80 focus-visible:ring-offset-2 focus-visible:ring-offset-canvas motion-reduce:transition-none motion-safe:active:scale-[0.98] sm:px-5"
  >
    <i class="fa-solid fa-plus text-xs" aria-hidden="true"></i>
    Agregar
  </button>
</div>
<!-- Contador + Ordenar + Filtrar -->
<div class="mt-4 flex flex-wrap items-center justify-between gap-x-4 gap-y-2">
  <!-- Contador -->
  <div
    class="flex items-center gap-2 text-sm text-slate-400"
    role="status"
    aria-live="polite"
    aria-atomic="true"
  >
    <span
      aria-hidden="true"
      class="h-1.5 w-1.5 shrink-0 rounded-full bg-blue-500 shadow-[0_0_8px] shadow-blue-500/60"
    ></span>
    <span
      ><strong class="font-semibold tabular-nums text-slate-100">{{ numberFound() ?? 0 }}</strong>
      {{ searchName() }}</span
    >
  </div>

  <!-- Filtros y orden (los define cada página) -->
  @if (filters().length > 0) {
    <div class="flex w-full flex-wrap gap-2 sm:w-auto sm:justify-end">
      @for (filter of filters(); track filter.key) {
        <select
          [attr.aria-label]="filter.label"
          (change)="onFilterChange(filter.key, $event)"
          class="h-11 min-w-40 flex-1 cursor-pointer truncate rounded-xl border border-slate-700/70 bg-slate-800/60 pr-8 pl-3 text-sm text-slate-300 outline-none transition-all duration-150 hover:border-slate-600 hover:text-slate-100 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/15 motion-reduce:transition-none sm:h-10 sm:flex-none"
        >
          @for (option of filter.options; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
      }
    </div>
  }
</div>
