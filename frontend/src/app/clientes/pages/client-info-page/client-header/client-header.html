<div class="flex items-start gap-4 mt-2">
  <!-- Boton Volver -->
  <back-button />

  <!-- Seccion info cliente -->
  <section
    class="w-full rounded-2xl border border-[#2a3247] bg-[#161c2e] p-6 shadow-[0_8px_40px_-12px_rgba(0,0,0,0.6)]"
  >
    <div class="flex flex-wrap items-start justify-between gap-6">
      <!-- Informacion cliente -->
      <div class="min-w-0 flex flex-col gap-1.5">
        <!-- Nombre y Apellido -->
        <h1 class="text-2xl font-bold tracking-tight text-slate-100 sm:text-3xl">
          {{ client().lastName }} {{ client().name }}
        </h1>
        <!-- Boton WhatsApp -->
        <div class="flex flex-wrap items-center gap-2">
          <whatsapp-button [phoneNumber]="client().phoneNumber" />
          <!--  Carnicerias -->
          @for (butcherShop of client().butcherShops; track butcherShop.id) {
            <button
              (click)="selectButcherShop(butcherShop.id)"
              [class.border-slate-400]="selectedButcherShopId() === butcherShop.id"
              [class.text-slate-100]="selectedButcherShopId() === butcherShop.id"
              class="inline-flex items-center gap-1.5 rounded-lg border cursor-pointer border-[#2a3247] bg-[#1a2235] px-3 py-1.5 text-sm text-slate-300 transition hover:border-slate-500 hover:text-slate-100"
            >
              <i class="fa-solid fa-shop"></i>
              {{ butcherShop.name }} - {{ butcherShop.address }}
            </button>
          }
        </div>
      </div>
      <!-- Info Saldo Pendiente -->
      <div class="flex flex-col items-end gap-3">
        <div class="rounded-2xl border border-red-500/30 bg-red-500/10 px-5 py-3">
          <p class="flex items-center gap-2 text-lg font-bold text-red-400 sm:text-xl">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
            </svg>
            {{ displayedBalance() | currency: 'ARS' : 'symbol-narrow' : '1.0-0' }}
          </p>
          <p class="mt-0.5 text-right text-xs text-slate-400">
            @if (selectedButcherShop(); as shop) {
              {{ shop.name }} - {{ shop.address }}
            } @else {
              Saldo deudor total
            }
          </p>
        </div>
      </div>
    </div>
  </section>
</div>
