<section
  class="h-full rounded-2xl border border-slate-800/90 bg-linear-to-b from-panel-from to-panel-to p-5 shadow-md shadow-black/20"
>
  <h2 class="text-sm font-semibold text-slate-100">Movimientos Recientes</h2>
  <p class="text-xs text-slate-400">Últimas operaciones</p>

  <ul class="mt-4 space-y-1">
    @for (row of rows(); track row.id) {
      <li class="flex items-center gap-3 rounded-lg px-2 py-2">
        <span
          [class]="
            'inline-flex w-16 shrink-0 justify-center rounded-md border px-2 py-1 text-[11px] font-semibold leading-none ' +
            row.badge
          "
        >
          {{ row.label }}
        </span>
        <div class="min-w-0 flex-1">
          <p class="truncate text-sm font-medium text-slate-100" [attr.title]="row.counterparty">
            {{ row.counterparty }}
          </p>
          <p class="wrap-break-word text-xs text-slate-400">{{ row.detail }}</p>
        </div>
        <div class="shrink-0 text-right">
          <p [class]="'font-mono text-sm font-bold tabular-nums ' + row.amountClass">
            {{ row.amount }}
          </p>
          <p class="font-mono text-[10px] text-slate-500">{{ row.code }}</p>
        </div>
      </li>
    } @empty {
      <li class="py-8 text-center text-sm text-slate-400">Todavía no hay movimientos</li>
    }
  </ul>
</section>
