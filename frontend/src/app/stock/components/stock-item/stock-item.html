<article
  [class]="cardClass()"
  [attr.role]="item().editable ? 'button' : null"
  [attr.tabindex]="item().editable ? 0 : null"
  [attr.title]="item().editable ? 'Ajustar pesos de la compra' : null"
  (click)="onActivate()"
  (keydown.enter)="onActivate()"
  (keydown.space)="$event.preventDefault(); onActivate()"
>
  <!-- Especie -->
  <span
    aria-hidden="true"
    [class]="
      'flex size-10 shrink-0 items-center justify-center rounded-xl border text-base ' +
      specie().badge
    "
  >
    <i [class]="specie().icon"></i>
  </span>

  <!-- Tipo, número de pieza y proveedor -->
  <div class="min-w-0 flex-1">
    <div class="flex min-w-0 items-center gap-2">
      <h3 class="truncate text-sm font-semibold text-slate-100 sm:text-base" [title]="typeLabel()">
        {{ typeLabel() }}
      </h3>
      @if (item().adjusted) {
        <span
          class="shrink-0 rounded-md border border-accent-500/30 bg-accent-500/10 px-1.5 py-0.5 text-[11px] font-medium leading-none text-accent-300"
        >
          Ajustado
        </span>
      }
    </div>
    <p class="truncate text-xs text-slate-400 sm:text-sm" [title]="item().supplierName">
      @if (item().totalUnits > 1) {
        Pieza {{ item().unitNumber }} de {{ item().totalUnits }} ·
      }
      {{ item().supplierName }}
    </p>
  </div>

  <!-- Peso y fecha de ingreso -->
  <div class="shrink-0 text-right">
    <p class="font-mono text-base font-bold tabular-nums text-slate-50 sm:text-lg">
      {{ item().kilograms | number: '1.0-2' }}
      <span class="font-sans text-xs font-medium text-slate-400">kg</span>
    </p>
    <p class="text-xs text-slate-400">{{ date() }}</p>
  </div>

  <!-- Indicio de que se puede editar -->
  @if (item().editable) {
    <i aria-hidden="true" class="fa-solid fa-pen shrink-0 text-xs text-slate-500"></i>
  }
</article>
