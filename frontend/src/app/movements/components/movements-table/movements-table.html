<table class="w-full text-left text-sm text-slate-300">
  <!-- Encabezado de la Tabla -->
  <thead
    class="border-b border-slate-800 bg-[#0F172A]/70 text-[11px] font-semibold uppercase tracking-wider text-slate-400"
  >
    <tr>
      <th scope="col" class="py-3.5 pl-6 pr-4">Fecha</th>
      <th scope="col" class="px-4 py-3.5">Tipo</th>
      <th scope="col" class="px-4 py-3.5">Corte / Detalle</th>
      <th scope="col" class="px-4 py-3.5 text-center">Unidad</th>
      <th scope="col" class="px-4 py-3.5 text-right">Kg/s</th>
      <th scope="col" class="px-4 py-3.5 text-right">Precio Unit.</th>
      <th scope="col" class="px-4 py-3.5 text-right text-slate-300">Debe (+)</th>
      <th scope="col" class="px-4 py-3.5 text-right text-emerald-400">Haber (-)</th>
      <th scope="col" class="py-3.5 pl-4 pr-6 text-right">Saldo</th>
    </tr>
  </thead>

  <!-- Cuerpo de la Tabla -->
  <tbody class="divide-y divide-slate-800/60 font-mono text-xs">
    <!-- Fila 1: Venta #1042 -->
    <tr sale-item class="bg-emerald-950/10 transition-colors hover:bg-emerald-950/20"></tr>

    <!-- Fila 2: Pago #0455 -->
    <tr payment-item class="bg-emerald-950/10 transition-colors hover:bg-emerald-950/20"></tr>
  </tbody>
</table>
