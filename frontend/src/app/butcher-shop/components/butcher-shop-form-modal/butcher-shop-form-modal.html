<div
  (click)="close()"
  (document:keydown.escape)="close()"
  class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/75 p-4 backdrop-blur-md modal-backdrop"
>
  <div
    (click)="$event.stopPropagation()"
    role="dialog"
    aria-modal="true"
    aria-labelledby="shop-modal-title"
    class="relative max-h-[calc(100dvh-2rem)] w-full max-w-lg overflow-y-auto overscroll-contain rounded-2xl border border-slate-800/90 bg-linear-to-b from-panel-from to-panel-to shadow-2xl shadow-black/80 ring-1 ring-white/10"
  >
    <div class="absolute inset-x-0 top-0 h-0.5 bg-linear-to-r"></div>
    <div
      class="flex items-start justify-between gap-4 border-b border-slate-800/80 px-5 py-5 sm:px-7"
    >
      <div class="flex min-w-0 items-center gap-3.5">
        <span
          aria-hidden="true"
          class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl border border-blue-500/25 bg-linear-to-br from-blue-600/25 to-indigo-600/10 text-blue-300 shadow-sm shadow-blue-500/10 ring-1 ring-inset ring-white/5"
        >
          <i class="fa-solid fa-shop text-base"></i>
        </span>
        <div class="min-w-0 space-y-0.5">
          <h2
            id="shop-modal-title"
            class="text-balance text-lg font-bold tracking-tight text-slate-50 sm:text-xl"
          >
            Nueva Sucursal
          </h2>
          <p class="text-sm text-slate-400">Datos de la sucursal del cliente</p>
        </div>
      </div>
      <button
        type="button"
        (click)="close()"
        class="-mr-1 -mt-1 flex size-10 shrink-0 cursor-pointer items-center justify-center rounded-xl border border-transparent text-slate-400 transition-ui duration-150 hover:border-slate-700/60 hover:bg-slate-800/70 hover:text-slate-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-400/70 motion-safe:active:scale-[0.97]"
        title="Cerrar modal"
        aria-label="Cerrar modal"
      >
        <i aria-hidden="true" class="fa-solid fa-xmark block text-base"></i>
      </button>
    </div>
    <form [formGroup]="butcherShopForm" (ngSubmit)="onSave()" class="space-y-5 px-5 py-6 sm:px-7">
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <!-- Nombre -->
        <div class="space-y-1.5">
          <label for="shop-name" class="block text-sm font-medium text-slate-200">
            Nombre <span aria-hidden="true" class="text-blue-400">*</span>
          </label>
          <input
            id="shop-name"
            type="text"
            autocomplete="off"
            formControlName="name"
            placeholder="Ej. La Pulpería"
            [attr.aria-invalid]="formUtils.isValidField(butcherShopForm, 'name')"
            [class.!border-red-500/80]="formUtils.isValidField(butcherShopForm, 'name')"
            [class.!ring-red-500/20]="formUtils.isValidField(butcherShopForm, 'name')"
            [class.animate-shake]="formUtils.isValidField(butcherShopForm, 'name')"
            class="w-full rounded-xl border border-slate-700/70 bg-canvas px-3.5 py-3 text-base text-slate-100 placeholder:text-slate-400 outline-none transition-ui hover:border-slate-600 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/15 sm:text-sm"
          />
          @if (formUtils.isValidField(butcherShopForm, 'name')) {
            <span
              role="alert"
              class="flex animate-fadeIn items-center gap-1.5 pt-0.5 text-xs font-medium text-red-400"
            >
              <i aria-hidden="true" class="fa-solid fa-triangle-exclamation shrink-0 text-xs"></i>
              {{ formUtils.getFieldError(butcherShopForm, 'name') }}
            </span>
          }
        </div>
        <!-- Dirección -->
        <div class="space-y-1.5">
          <label for="shop-address" class="block text-sm font-medium text-slate-200">
            Dirección <span aria-hidden="true" class="text-blue-400">*</span>
          </label>
          <input
            id="shop-address"
            type="text"
            autocomplete="off"
            formControlName="address"
            placeholder="Ej. 8 de Junio 123"
            [attr.aria-invalid]="formUtils.isValidField(butcherShopForm, 'address')"
            [class.!border-red-500/80]="formUtils.isValidField(butcherShopForm, 'address')"
            [class.!ring-red-500/20]="formUtils.isValidField(butcherShopForm, 'address')"
            [class.animate-shake]="formUtils.isValidField(butcherShopForm, 'address')"
            class="w-full rounded-xl border border-slate-700/70 bg-canvas px-3.5 py-3 text-base text-slate-100 placeholder:text-slate-400 outline-none transition-ui hover:border-slate-600 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/15 sm:text-sm"
          />
          @if (formUtils.isValidField(butcherShopForm, 'address')) {
            <span
              role="alert"
              class="flex animate-fadeIn items-center gap-1.5 pt-0.5 text-xs font-medium text-red-400"
            >
              <i aria-hidden="true" class="fa-solid fa-triangle-exclamation shrink-0 text-xs"></i>
              {{ formUtils.getFieldError(butcherShopForm, 'address') }}
            </span>
          }
        </div>
      </div>
      <div
        class="mt-2 flex flex-col-reverse gap-3 border-t border-slate-800/80 pt-5 sm:flex-row sm:items-center sm:justify-end"
      >
        <button
          type="button"
          (click)="close()"
          class="inline-flex w-full cursor-pointer items-center justify-center rounded-xl border border-slate-700/70 bg-slate-800/50 px-5 py-3 text-sm font-semibold text-slate-300 transition-ui duration-150 hover:bg-slate-800 hover:text-slate-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-400/60 motion-safe:active:scale-[0.97] sm:w-auto"
        >
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="butcherShopForm.invalid"
          class="inline-flex w-full cursor-pointer items-center justify-center gap-2 rounded-xl bg-blue-600 px-6 py-3 text-sm font-semibold text-white shadow-lg shadow-blue-600/20 transition-ui duration-150 enabled:hover:bg-blue-500 enabled:hover:shadow-blue-600/30 motion-safe:enabled:active:scale-[0.97] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-300/80 focus-visible:ring-offset-2 focus-visible:ring-offset-panel-to disabled:cursor-not-allowed disabled:bg-slate-800 disabled:text-slate-500 disabled:shadow-none sm:w-auto"
        >
          <i aria-hidden="true" class="fa-solid fa-check text-xs"></i> <span>Crear Sucursal</span>
        </button>
      </div>
    </form>
  </div>
</div>
