server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Angular es una SPA: cualquier ruta (/clientes, /caja...) debe devolver index.html
    # y el router de Angular decide que pantalla mostrar. Sin esto, F5 en /clientes da 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los .js y .css llevan un hash en el nombre: pueden cachearse un año sin riesgo
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
