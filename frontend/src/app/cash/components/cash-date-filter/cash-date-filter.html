<!-- Encabezado y filtro de fechas -->
<div
  class="relative max-w-3xl mx-auto px-6 py-6 mt-2 mb-6 overflow-hidden rounded-2xl border border-slate-800/90 bg-linear-to-b from-[#131b2e] to-[#0e1626] text-white shadow-xl shadow-black/40 ring-1 ring-white/10"
>
  <!-- Línea sutil de acento superior -->
  <div class="absolute inset-x-0 top-0 h-0.5 bg-linear-to-r"></div>
  <div class="flex flex-wrap items-end justify-between gap-4">
    <!-- Título y descripción con badge de contexto -->
    <div class="flex items-center gap-3.5">
      <span
        class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-linear-to-br from-blue-600/20 to-indigo-600/10 text-blue-400 border border-blue-500/20 shadow-sm shadow-blue-500/10"
      >
        <i class="fa-solid fa-vault text-base"></i>
      </span>
      <div>
        <h1 class="text-lg font-bold tracking-tight text-white">Caja Ahorro</h1>
        <p class="text-xs text-slate-400">Pagos recibidos por día y efectivo acumulado</p>
      </div>
    </div>
    <!-- Filtros de fecha (Desde / Hasta) -->
    <div class="flex items-end gap-3">
      <div class="space-y-1.5">
        <label class="block text-xs font-semibold tracking-wider text-slate-300"> Desde </label>
        <input
          type="date"
          [value]="from()"
          (change)="onFromChange($event)"
          class="cursor-pointer rounded-xl border border-slate-800 bg-[#0a0f1d] px-3.5 py-2 text-sm text-slate-100 outline-none transition-all duration-150 hover:border-slate-700 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/15 scheme-dark"
        />
      </div>
      <div class="space-y-1.5">
        <label class="block text-xs font-semibold tracking-wider text-slate-300"> Hasta </label>
        <input
          type="date"
          [value]="to()"
          (change)="onToChange($event)"
          class="cursor-pointer rounded-xl border border-slate-800 bg-[#0a0f1d] px-3.5 py-2 text-sm text-slate-100 outline-none transition-all duration-150 hover:border-slate-700 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/15 scheme-dark"
        />
      </div>
    </div>
  </div>
</div>
