<div class="mx-auto max-w-6xl px-3 pb-6 sm:px-4">
  @if (clientResource.hasValue() && clientResource.value(); as client) {
    <!-- Contenedor de Info del Cliente -->
    <client-header
      [client]="client"
      (edit)="showModal.set(true)"
      (remove)="showRemoveModal.set(true)"
      (saleCreated)="clientResource.reload(); movementsTable.reload()"
      (paymentCreated)="clientResource.reload(); movementsTable.reload()"
      (shopSelected)="selectedButcherShopId.set($event)"
      (butcherShopCreated)="clientResource.reload()"
    />

    <!-- Divisior (filtros) -->
    <movements-filters
      [options]="movementFilters"
      [(selectedType)]="movementType"
      [(dateRange)]="dateRange"
    />

    <!-- Tabla Movimientos -->
    <div class="w-full overflow-hidden rounded-xl border border-slate-800 bg-canvas shadow-2xl">
      <div class="max-h-100 overflow-auto scrollbar-none">
        <movements-table
          #movementsTable
          [butcherShopId]="selectedButcherShopId()"
          [currentCurrentId]="selectedCurrentAccountId()"
          [movementType]="movementType()"
          [dateRange]="dateRange()"
          (movementChanged)="clientResource.reload()"
        />
      </div>
    </div>
    <!-- Estado de carga -->
  } @else if (clientResource.isLoading()) {
    <div class="m-auto mt-10">
      <loading-spinner />
    </div>
    <!-- Estado de error -->
  } @else if (clientResource.error()) {
    <error-state
      title="No se pudo cargar el cliente"
      [error]="clientResource.error()"
      (retry)="clientResource.reload()"
    />
  }
</div>

@if (showModal() && clientResource.value(); as client) {
  <client-form-modal
    description="Editar Cliente"
    [client]="client"
    (cancel)="showModal.set(false)"
    (saved)="showModal.set(false); clientResource.reload()"
  />
}

@if (showRemoveModal() && clientResource.value(); as client) {
  <delete-modal
    description="Eliminar Cliente"
    entityType="El cliente"
    [entityName]="`${client.lastName} ${client.name}`"
    [permanent]="false"
    [warning]="deleteWarning()"
    [loading]="deleting()"
    (cancel)="showRemoveModal.set(false)"
    (confirm)="deleteClient(client.id)"
  />
}
