<button
  type="button"
  (click)="open.emit()"
  aria-haspopup="dialog"
  class="group flex w-full cursor-pointer items-center justify-between gap-3 rounded-2xl border border-slate-800/80 bg-linear-to-b from-[#121929] to-[#0c1220] px-5 py-3.5 text-left shadow-lg shadow-black/40 ring-1 ring-white/5 transition-all duration-200 hover:border-blue-500/30 hover:from-[#151e33] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-400/70 active:scale-[0.995] motion-reduce:transition-none"
>
  <div class="flex min-w-0 items-center gap-3">
    <span
      aria-hidden="true"
      class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg border border-amber-500/25 bg-amber-500/10 text-amber-300 shadow-xs"
    >
      <i class="fa-regular fa-calendar text-sm"></i>
    </span>
    <div class="min-w-0">
      <h3 class="truncate text-sm font-semibold tracking-tight text-white sm:text-base">
        Caja {{ title() }}
      </h3>
      <p class="truncate text-xs text-slate-400">
        {{ day().payments.length }} {{ day().payments.length === 1 ? 'pago' : 'pagos' }}
        @if (day().withdrawals.length > 0) {
          · {{ day().withdrawals.length }}
          {{ day().withdrawals.length === 1 ? 'extracción' : 'extracciones' }}
        }
      </p>
    </div>
  </div>
  <div class="flex shrink-0 items-center gap-3">
    <div class="text-right">
      <span class="block text-[11px] font-medium uppercase tracking-wider text-emerald-300/80"
        >Cierre</span
      >
      <span class="font-mono text-sm font-bold tabular-nums text-emerald-200 sm:text-base">
        {{ day().closingBalance | currency: 'ARS' : 'symbol-narrow' : '1.2-2' }}
      </span>
    </div>
    <i
      aria-hidden="true"
      class="fa-solid fa-chevron-right text-xs text-slate-400 transition-transform duration-200 group-hover:translate-x-0.5 group-hover:text-slate-200 motion-reduce:transition-none"
    ></i>
  </div>
</button>
