<div
  class="group flex cursor-pointer touch-manipulation items-center justify-between gap-x-4 gap-y-2 rounded-xl border border-line bg-panel-from px-4 py-3 shadow-sm shadow-black/20 transition-ui duration-150 hover:border-slate-600 hover:bg-raised active:border-slate-600 active:bg-raised motion-reduce:transition-none motion-safe:active:scale-[0.995]"
>
  <!-- Nombre del corte + categoría -->
  <div class="flex min-w-0 flex-wrap items-center gap-x-2.5 gap-y-1.5">
    <span
      [title]="cutMeatName() | titlecase"
      [class.opacity-70]="!isActive()"
      class="max-w-full truncate text-sm font-semibold tracking-tight text-slate-100 transition-ui duration-150 group-hover:text-slate-50 group-hover:opacity-100 motion-reduce:transition-none sm:text-base"
    >
      {{ cutMeatName() | titlecase }}
    </span>
    <span
      [class]="
        'inline-flex shrink-0 items-center rounded-md border px-2 py-1 text-xs font-medium leading-none ' +
        specieBadgeClass()
      "
    >
      {{ translateSpecie(specie()) }}
    </span>
    @if (isActive()) {
      <span
        class="inline-flex shrink-0 items-center gap-1.5 rounded-md border border-emerald-500/30 bg-emerald-500/10 px-2 py-1 text-xs font-medium leading-none text-emerald-300 before:size-1.5 before:shrink-0 before:rounded-full before:bg-emerald-400"
      >
        Activo
      </span>
    } @else {
      <span
        class="inline-flex shrink-0 items-center gap-1.5 rounded-md border border-slate-600/50 bg-slate-700/30 px-2 py-1 text-xs font-medium leading-none text-slate-400 before:size-1.5 before:shrink-0 before:rounded-full before:bg-slate-500"
      >
        Inactivo
      </span>
    }
  </div>

  <!-- Precio por kilo -->
  <div
    role="group"
    aria-label="Precio por kilo"
    class="flex shrink-0 items-baseline gap-1 whitespace-nowrap rounded-lg border border-blue-500/25 bg-linear-to-br from-blue-500/15 to-blue-500/5 px-3 py-1.5 ring-1 ring-inset ring-white/5 transition-colors duration-150 group-hover:border-blue-400/40 motion-reduce:transition-none"
  >
    <span class="font-sans text-base font-bold tabular-nums tracking-tight text-blue-200">{{
      price() | currency: 'ARS' : 'symbol-narrow' : '1.2-2'
    }}</span>
    <span class="text-xs font-medium text-blue-300/80">/kg</span>
  </div>
</div>
