<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Sistema de Gestión</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0f1d" />
    <link rel="icon" type="image/png" href="logo.png" />
    <script>
      // Aplica el tema guardado antes de que se dibuje la página (evita el destello)
      (function () {
        var theme = 'dark';
        try {
          var saved = localStorage.getItem('theme') || 'dark';
          theme =
            saved === 'light'
              ? 'light'
              : saved === 'system'
                ? matchMedia('(prefers-color-scheme: dark)').matches
                  ? 'dark'
                  : 'light'
                : 'dark';
          // Aplica el acento guardado antes de que se dibuje la página
          var accent = localStorage.getItem('accent');
          if (accent === 'emerald' || accent === 'violet' || accent === 'amber') {
            document.documentElement.setAttribute('data-accent', accent);
          }
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        var light = theme === 'light';
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', light ? '#f4f2ee' : '#0a0f1d');
        document
          .querySelector('meta[name="color-scheme"]')
          .setAttribute('content', light ? 'light' : 'dark');
      })();
    </script>
  </head>
  <body class="bg-canvas">
    <app-root></app-root>
  </body>
</html>
