<a
  [routerLink]="pathRoute()"
  (click)="itemClick.emit(item())"
  class="group mb-2 block cursor-pointer touch-manipulation rounded-2xl border border-line bg-panel-from px-4 py-3.5 text-slate-50 shadow-sm shadow-black/20 transition-ui duration-150 hover:border-blue-500/40 hover:bg-raised focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-400/70 focus-visible:ring-offset-2 focus-visible:ring-offset-canvas motion-reduce:transition-none motion-safe:active:scale-[0.99]"
>
  <div class="flex items-center gap-4">
    <!-- Foto -->
    <div
      class="flex size-12 shrink-0 items-center justify-center rounded-full border border-blue-500/25 bg-blue-500/15 transition-colors duration-150 group-hover:border-blue-400/50 group-hover:bg-blue-500/25 motion-reduce:transition-none"
    >
      <span
        aria-hidden="true"
        class="text-sm font-semibold uppercase tracking-wide text-blue-200"
        >{{ item().initials }}</span
      >
    </div>

    <!-- Info -->
    <div class="min-w-0 flex-1">
      <p class="truncate text-base font-semibold text-slate-100" [title]="item().title">
        {{ item().title }}
      </p>
      <p class="mt-0.5 truncate text-sm text-slate-400" [title]="item().subtitle">
        {{ item().subtitle }}
      </p>
    </div>

    <!-- Chevron -->
    <i
      aria-hidden="true"
      class="fa-solid fa-chevron-right shrink-0 text-xs text-slate-600 transition-ui duration-150 group-hover:text-blue-300 motion-reduce:transition-none"
    ></i>
  </div>
</a>
