<section
  class="h-full rounded-2xl border border-slate-800/90 bg-linear-to-b from-panel-from to-panel-to p-5 shadow-md shadow-black/20 sm:p-6"
>
  <div class="flex flex-wrap items-start justify-between gap-3">
    <div>
      <h2 class="text-sm font-semibold text-slate-100">Evolución de Flujos</h2>
      <p class="text-xs text-blue-300">Últimos 12 meses</p>
    </div>

    <div
      role="group"
      aria-label="Tipo de flujo"
      class="inline-flex items-center gap-0.5 rounded-lg border border-slate-800 bg-surface/60 p-1"
    >
      @for (option of modes; track option.value) {
        <button
          type="button"
          [attr.aria-pressed]="mode() === option.value"
          (click)="mode.set(option.value)"
          class="min-h-9 cursor-pointer touch-manipulation whitespace-nowrap rounded-md px-3 text-xs font-medium text-slate-400 transition-colors hover:text-slate-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-400/70 motion-reduce:transition-none aria-pressed:bg-blue-600 aria-pressed:text-white aria-pressed:shadow-sm aria-pressed:hover:bg-blue-500"
        >
          {{ option.label }}
        </button>
      }
    </div>
  </div>

  <chart-canvas class="mt-4 h-72" [config]="config()" [label]="chartLabel()" />

  <!-- Leyenda -->
  <ul class="mt-3 flex justify-center gap-5 text-xs text-slate-400">
    @for (serie of series(); track serie.label) {
      <li class="flex items-center gap-1.5">
        <span
          aria-hidden="true"
          class="h-0.5 w-4 rounded-full"
          [style.background-color]="serie.color"
        ></span>
        {{ serie.label }}
      </li>
    }
  </ul>
</section>
