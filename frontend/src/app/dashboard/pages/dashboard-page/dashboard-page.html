<div class="mx-auto max-w-7xl space-y-4 px-3 py-6 sm:px-6">
  <header>
    <h1 class="text-2xl font-bold tracking-tight text-slate-50 sm:text-3xl">Panel de Inicio</h1>
    <p class="mt-1 text-sm text-blue-300">
      Resumen financiero · Actualizado al {{ today }}
    </p>
  </header>

  @if (dashboard.error()) {
    <error-state [error]="dashboard.error()" (retry)="dashboard.reload()" />
  } @else if (view(); as v) {
    <!-- Indicadores. El retardo escalonado (30 ms por bloque) arma la pantalla de arriba hacia abajo. -->
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-[1.5fr_1fr_1fr_1fr]">
      <kpi-card
        class="animate-rise sm:col-span-2 xl:col-span-1"
        [featured]="true"
        label="Balance neto"
        tone="amber"
        [subtitle]="v.net >= 0 ? 'Saldo a favor' : 'Saldo en contra'"
        [value]="v.net"
        [change]="v.netChange"
      />
      <kpi-card
        class="animate-rise [animation-delay:30ms]"
        label="Por cobrar"
        tone="emerald"
        subtitle="Saldo de clientes"
        [value]="v.data.receivable"
        [change]="v.receivableChange"
      />
      <kpi-card
        class="animate-rise [animation-delay:60ms]"
        label="Por pagar"
        tone="rose"
        subtitle="Deuda con proveedores"
        [value]="v.data.payable"
        [change]="v.payableChange"
        [invertTrend]="true"
      />
      <kpi-card
        class="animate-rise [animation-delay:90ms]"
        [label]="'Ventas (' + v.monthLabel + ')'"
        tone="amber"
        subtitle="Mes en curso"
        [value]="v.current.sales"
        [change]="v.salesChange"
      />
    </div>

    <!-- Evolución y resumen del mes -->
    <div class="grid gap-4 lg:grid-cols-3">
      <flow-chart-card
        class="block animate-rise [animation-delay:120ms] lg:col-span-2"
        [months]="v.data.months"
      />
      <monthly-summary-card
        class="block animate-rise [animation-delay:150ms]"
        [month]="v.current"
      />
    </div>

    <!-- Rankings y últimos movimientos -->
    <div class="grid gap-4 lg:grid-cols-3">
      <ranking-card
        class="animate-rise [animation-delay:180ms]"
        title="Top Clientes"
        subtitle="Por saldo adeudado"
        tone="emerald"
        pathRoute="/home/clientes"
        linkLabel="Ver todos los clientes"
        emptyText="Ningún cliente con deuda"
        [items]="v.data.topClients"
        [total]="v.data.receivable"
      />
      <ranking-card
        class="animate-rise [animation-delay:210ms]"
        title="Top Proveedores"
        subtitle="Por deuda pendiente"
        tone="rose"
        pathRoute="/home/proveedores"
        linkLabel="Ver todos los proveedores"
        emptyText="No le debés a ningún proveedor"
        [items]="v.data.topSuppliers"
        [total]="v.data.payable"
      />
      <recent-movements-card
        class="block animate-rise [animation-delay:240ms]"
        [movements]="v.data.recentMovements"
      />
    </div>

    <!-- Comparativa de 12 meses -->
    <monthly-comparison-card
      class="block animate-rise [animation-delay:270ms]"
      [months]="v.data.months"
    />
  } @else {
    <!-- Esqueleto con la misma grilla que el panel real: al cargar los datos no hay saltos de layout -->
    <div role="status" aria-label="Cargando panel" class="space-y-4">
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4">
        @for (card of [0, 1, 2, 3]; track card) {
          <div
            aria-hidden="true"
            class="h-32 animate-pulse rounded-2xl border border-slate-800/90 bg-panel-from p-5 motion-reduce:animate-none"
          >
            <div class="h-3 w-24 rounded bg-slate-800/80"></div>
            <div class="mt-5 h-7 w-3/5 rounded-md bg-slate-800/80"></div>
            <div class="mt-3 h-3 w-1/3 rounded bg-slate-800/60"></div>
          </div>
        }
      </div>
      <div class="grid gap-4 lg:grid-cols-3">
        <div
          aria-hidden="true"
          class="h-96 animate-pulse rounded-2xl border border-slate-800/90 bg-panel-from motion-reduce:animate-none lg:col-span-2"
        ></div>
        <div
          aria-hidden="true"
          class="h-96 animate-pulse rounded-2xl border border-slate-800/90 bg-panel-from motion-reduce:animate-none"
        ></div>
      </div>
      <div class="grid gap-4 lg:grid-cols-3">
        @for (card of [0, 1, 2]; track card) {
          <div
            aria-hidden="true"
            class="h-72 animate-pulse rounded-2xl border border-slate-800/90 bg-panel-from motion-reduce:animate-none"
          ></div>
        }
      </div>
    </div>
  }
</div>
