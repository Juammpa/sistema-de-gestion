<div
  aria-live="polite"
  class="pointer-events-none fixed inset-x-0 bottom-0 z-60 flex flex-col items-stretch gap-2 p-4 sm:items-end"
>
  @for (toast of notifications.toasts(); track toast.id) {
    <div
      [attr.role]="toast.kind === 'error' ? 'alert' : 'status'"
      [class]="styles[toast.kind].box"
      animate.leave="toast-leave"
      class="pointer-events-auto flex w-full items-start gap-3 rounded-xl border px-4 py-3 text-sm shadow-xl shadow-black/40 backdrop-blur-md transition duration-200 ease-out starting:translate-y-2 starting:opacity-0 motion-reduce:starting:translate-y-0 sm:w-96"
    >
      <i [class]="styles[toast.kind].icon" class="mt-0.5 shrink-0" aria-hidden="true"></i>
      <p class="flex-1 leading-snug">{{ toast.message }}</p>
      <button
        type="button"
        (click)="notifications.dismiss(toast.id)"
        aria-label="Cerrar aviso"
        class="-mr-2 -my-1 flex size-8 shrink-0 cursor-pointer items-center justify-center rounded-md text-current/60 transition-colors hover:bg-white/10 hover:text-current focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/40"
      >
        <i class="fa-solid fa-xmark text-xs" aria-hidden="true"></i>
      </button>
    </div>
  }
</div>
