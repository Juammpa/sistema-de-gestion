<div
  class="relative z-20 mt-3 mb-3 flex flex-col gap-3 rounded-xl border border-slate-800/80 bg-[#0c121e]/90 p-3 shadow-lg backdrop-blur-sm sm:flex-row sm:items-center sm:justify-between"
>
  <!-- Grupo Izquierdo: Buscador y Pestañas de Tipo de Movimiento -->
  <div class="flex flex-1 flex-col gap-3 sm:flex-row sm:items-center">
    <!-- Input de Búsqueda -->
    <div class="relative w-full max-w-md flex-1 sm:min-w-65">
      <div
        class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500"
      >
        <svg
          aria-hidden="true"
          class="h-4 w-4"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
          />
        </svg>
      </div>
      <input
        type="search"
        aria-label="Buscar movimientos"
        autocomplete="off"
        placeholder="Buscar por corte, remito o comprobante..."
        class="h-11 w-full rounded-lg border border-slate-800 bg-[#0F172A]/70 pl-10 pr-4 text-base text-slate-200 transition-colors scheme-dark placeholder:text-slate-400 hover:border-slate-700 focus:border-blue-500 focus:bg-[#0F172A] focus:outline-none focus:ring-4 focus:ring-blue-500/15 motion-reduce:transition-none sm:h-9 sm:text-sm"
      />
    </div>

    <!-- Segmented Tabs / Filtros rápidos (los define cada página) -->
    <div
      role="group"
      aria-label="Tipo de movimiento"
      class="inline-flex w-full items-center gap-0.5 rounded-lg border border-slate-800 bg-[#0F172A]/60 p-1 sm:w-auto"
    >
      @for (option of options(); track option.label) {
        <button
          type="button"
          [attr.aria-pressed]="selectedType() === option.value"
          (click)="selectedType.set(option.value)"
          class="min-h-9 flex-1 cursor-pointer touch-manipulation whitespace-nowrap rounded-md px-3 text-xs font-medium text-slate-400 transition-colors hover:text-slate-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-400/70 motion-reduce:transition-none aria-pressed:bg-blue-600 aria-pressed:text-white aria-pressed:shadow-sm aria-pressed:hover:bg-blue-500 sm:flex-none sm:text-sm"
        >
          {{ option.label }}
        </button>
      }
    </div>
  </div>

  <!-- Grupo Derecho: Selector de Rango de Fechas y Botón Refrescar -->
  <div class="flex w-full items-center gap-2 sm:w-auto">
    <!-- Selector de Fechas -->
    <div class="relative flex-1 sm:flex-none">
      <button
        type="button"
        (click)="togglePanel()"
        aria-haspopup="dialog"
        [attr.aria-expanded]="panelOpen()"
        [class.!border-blue-500/50]="hasRange()"
        title="Cambiar rango de fechas"
        class="inline-flex min-h-10 w-full cursor-pointer touch-manipulation items-center justify-center gap-2 rounded-lg border border-slate-800 bg-[#0F172A]/70 px-3 text-xs font-medium text-slate-300 transition-all duration-150 hover:border-slate-700 hover:bg-[#0F172A] hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-400/70 focus-visible:ring-offset-2 focus-visible:ring-offset-[#0c121e] motion-reduce:transition-none motion-safe:active:scale-[0.98] sm:min-h-9 sm:w-auto"
      >
        <svg
          aria-hidden="true"
          class="h-3.5 w-3.5 shrink-0 text-slate-400"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
          />
        </svg>
        <span class="truncate font-mono text-xs text-slate-200">{{ rangeLabel() }}</span>
      </button>

      <!-- Panel de fechas -->
      @if (panelOpen()) {
        <div
          role="dialog"
          aria-label="Filtrar por fecha"
          class="absolute inset-x-0 top-full z-30 mt-2 space-y-4 rounded-xl border border-slate-700/70 bg-[#0e1626] p-4 shadow-2xl shadow-black/60 ring-1 ring-white/10 sm:inset-x-auto sm:right-0 sm:w-80"
        >
          <!-- Atajos -->
          <div role="group" aria-label="Atajos de fecha" class="flex flex-wrap gap-2">
            @for (preset of presets; track preset.days) {
              <button
                type="button"
                (click)="applyLastDays(preset.days)"
                class="cursor-pointer rounded-lg border border-[#2a3247] bg-[#1a2235] px-2.5 py-1.5 text-xs font-medium text-slate-300 transition-colors duration-150 hover:border-blue-500/50 hover:bg-blue-500/10 hover:text-blue-300 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-400/70 motion-reduce:transition-none"
              >
                {{ preset.label }}
              </button>
            }
          </div>

          <!-- Rango personalizado -->
          <div class="grid grid-cols-2 gap-3">
            <div class="min-w-0 space-y-1.5">
              <label for="movements-date-from" class="block text-xs font-medium text-slate-300">
                Desde
              </label>
              <input
                id="movements-date-from"
                type="date"
                [value]="draftFrom()"
                (change)="onDraftFromChange($event)"
                class="h-10 w-full cursor-pointer rounded-lg border border-slate-700/70 bg-[#0a0f1d] px-2.5 text-base tabular-nums text-slate-100 outline-none transition-colors duration-150 scheme-dark hover:border-slate-600 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/15 sm:text-sm"
              />
            </div>
            <div class="min-w-0 space-y-1.5">
              <label for="movements-date-to" class="block text-xs font-medium text-slate-300">
                Hasta
              </label>
              <input
                id="movements-date-to"
                type="date"
                [value]="draftTo()"
                (change)="onDraftToChange($event)"
                class="h-10 w-full cursor-pointer rounded-lg border border-slate-700/70 bg-[#0a0f1d] px-2.5 text-base tabular-nums text-slate-100 outline-none transition-colors duration-150 scheme-dark hover:border-slate-600 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/15 sm:text-sm"
              />
            </div>
          </div>

          @if (invalidRange()) {
            <p role="alert" class="flex items-center gap-1.5 text-xs font-medium text-red-400">
              <i
                aria-hidden="true"
                class="fa-solid fa-triangle-exclamation shrink-0 text-[11px]"
              ></i>
              «Desde» no puede ser posterior a «Hasta»
            </p>
          }

          <!-- Acciones -->
          <div class="flex items-center justify-end gap-2 border-t border-slate-800/80 pt-3">
            <button
              type="button"
              (click)="clear()"
              class="h-9 cursor-pointer rounded-lg border border-slate-700/70 bg-slate-800/50 px-3.5 text-xs font-semibold text-slate-300 transition-colors duration-150 hover:bg-slate-800 hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-400/60 motion-reduce:transition-none"
            >
              Limpiar
            </button>
            <button
              type="button"
              (click)="apply()"
              [disabled]="invalidRange()"
              class="h-9 cursor-pointer rounded-lg bg-blue-600 px-4 text-xs font-semibold text-white shadow-lg shadow-blue-600/20 transition-all duration-150 enabled:hover:bg-blue-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-300/80 disabled:cursor-not-allowed disabled:bg-slate-800 disabled:text-slate-500 disabled:shadow-none motion-reduce:transition-none"
            >
              Aplicar
            </button>
          </div>
        </div>
      }
    </div>
  </div>
</div>
