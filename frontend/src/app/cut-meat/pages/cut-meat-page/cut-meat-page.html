<!-- Búsqueda y creación de cortes -->
<div
  class="max-w-3xl mx-auto px-6 py-6 mt-2 mb-6 border-slate-800 border rounded-2xl text-white bg-slate-900"
>
  <search-input
    placeholder="Buscar cortes..."
    [numberFound]="cutMeatsActive() ?? 0"
    searchName="cortes activos"
    (add)="showModal.set(true)"
  />
</div>

<!-- Lista de cortes -->
<div class="flex flex-col gap-3 max-w-3xl mx-auto max-h-105 overflow-y-auto scrollbar-none">
  <!--  -->
  @if (cutMeatResource.isLoading()) {
    <!-- Mostrar estado de carga -->
    <div class="m-auto">
      <loading-spinner />
    </div>
  } @else if (cutMeatResource.error()) {
    <!-- Mostrar estado de error -->
    <empty-state infoMessage="No se pudo conectar al servidor" />
  } @else if (cutMeatResource.hasValue()) {
    <!-- Iterar lista de cortes (activos e inactivos) -->
    @for (item of cutMeatResource.value(); track item.id) {
      <!-- Mostrar unicamente los cortes de carnes activos -->
      <cut-meat-list-item
        [cutMeatName]="item.cutMeatName"
        [specie]="item.specie"
        [price]="item.pricePerKilo"
        [isActive]="item.isActive"
        (click)="openCutMeatDetail(item)"
      />
    }
  }
</div>

@if (showModal()) {
  <cut-meat-form-modal
    (cancel)="showModal.set(false)"
    (created)="showModal.set(false); cutMeatResource.reload()"
  />
}

@if (showCutMeatDetail() && cutMeatDetail.value(); as cutMeat) {
  <edit-cut-meat-modal
    (cancel)="showCutMeatDetail.set(false)"
    [cutMeat]="cutMeat"
    (saved)="onCutMeatChanged()"
    (deleted)="onCutMeatChanged()"
  />
}
