<div
  class="mt-3 mb-3 flex flex-col gap-3 rounded-xl border border-slate-800/80 bg-[#0c121e]/90 p-3 shadow-lg backdrop-blur-sm sm:flex-row sm:items-center sm:justify-between"
>
  <!-- Grupo Izquierdo: Buscador y Pestañas de Tipo de Movimiento -->
  <div class="flex flex-1 flex-col gap-3 sm:flex-row sm:items-center">
    <!-- Input de Búsqueda -->
    <div class="relative w-full max-w-md flex-1 sm:min-w-65">
      <div
        class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500"
      >
        <svg
          aria-hidden="true"
          class="h-4 w-4"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
          />
        </svg>
      </div>
      <input
        type="search"
        aria-label="Buscar movimientos"
        autocomplete="off"
        placeholder="Buscar por corte, remito o comprobante..."
        class="h-11 w-full rounded-lg border border-slate-800 bg-[#0F172A]/70 pl-10 pr-4 text-base text-slate-200 transition-colors scheme-dark placeholder:text-slate-400 hover:border-slate-700 focus:border-blue-500 focus:bg-[#0F172A] focus:outline-none focus:ring-4 focus:ring-blue-500/15 motion-reduce:transition-none sm:h-9 sm:text-sm"
      />
    </div>

    <!-- Segmented Tabs / Filtros rápidos (los define cada página) -->
    <div
      role="group"
      aria-label="Tipo de movimiento"
      class="inline-flex w-full items-center gap-0.5 rounded-lg border border-slate-800 bg-[#0F172A]/60 p-1 sm:w-auto"
    >
      @for (option of options(); track option.label) {
        <button
          type="button"
          [attr.aria-pressed]="selectedType() === option.value"
          (click)="selectedType.set(option.value)"
          class="min-h-9 flex-1 cursor-pointer touch-manipulation whitespace-nowrap rounded-md px-3 text-xs font-medium text-slate-400 transition-colors hover:text-slate-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-400/70 motion-reduce:transition-none aria-pressed:bg-blue-600 aria-pressed:text-white aria-pressed:shadow-sm aria-pressed:hover:bg-blue-500 sm:flex-none sm:text-sm"
        >
          {{ option.label }}
        </button>
      }
    </div>
  </div>

  <!-- Grupo Derecho: Selector de Rango de Fechas y Botón Refrescar -->
  <div class="flex w-full items-center gap-2 sm:w-auto">
    <!-- Selector de Fechas -->
    <button
      type="button"
      title="Cambiar rango de fechas"
      class="inline-flex min-h-10 flex-1 cursor-pointer touch-manipulation items-center justify-center gap-2 rounded-lg border border-slate-800 bg-[#0F172A]/70 px-3 text-xs font-medium text-slate-300 transition-all duration-150 hover:border-slate-700 hover:bg-[#0F172A] hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-400/70 focus-visible:ring-offset-2 focus-visible:ring-offset-[#0c121e] motion-reduce:transition-none motion-safe:active:scale-[0.98] sm:min-h-9 sm:flex-none"
    >
      <svg
        aria-hidden="true"
        class="h-3.5 w-3.5 shrink-0 text-slate-400"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
        />
      </svg>
      <span class="font-mono text-xs text-slate-200">01/10/2023 - 24/10/2023</span>
    </button>

    <!-- Botón Recargar / Refrescar -->
    <button
      type="button"
      title="Actualizar datos"
      aria-label="Actualizar datos"
      class="inline-flex size-10 shrink-0 cursor-pointer touch-manipulation items-center justify-center rounded-lg border border-slate-800 bg-[#0F172A]/70 text-slate-400 transition-all duration-150 hover:border-slate-700 hover:bg-[#0F172A] hover:text-slate-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-400/70 focus-visible:ring-offset-2 focus-visible:ring-offset-[#0c121e] motion-reduce:transition-none motion-safe:active:scale-95 sm:size-9"
    >
      <svg aria-hidden="true" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
        />
      </svg>
    </button>
  </div>
</div>
