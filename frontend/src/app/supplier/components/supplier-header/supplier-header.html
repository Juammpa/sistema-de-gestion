<div class="m-2 flex flex-col gap-3 sm:flex-row sm:items-start sm:gap-4">
  <!-- Boton Volver -->
  <div class="flex shrink-0 flex-row flex-wrap gap-2 sm:flex-col sm:justify-center sm:gap-1.5">
    <back-button />
    <add-payment-button (addPayment)="showPaymentModal.set(true)" />
    <add-purchase-button (addPurchase)="showPurchaseModal.set(true)" />
  </div>

  <!-- Seccion info proveedor -->
  <section
    class="min-w-0 w-full rounded-2xl border border-slate-800/90 bg-linear-to-b from-[#161d31] to-[#0f1524] p-5 shadow-xl shadow-black/40 ring-1 ring-white/5 sm:p-6"
  >
    <div class="flex flex-wrap items-start justify-between gap-x-6 gap-y-5">
      <!-- Informacion proveedor -->
      <div class="flex min-w-0 flex-1 flex-col gap-3">
        <!-- Nombre de la empresa + Accion Editar/Eliminar -->
        <div class="flex flex-wrap items-center gap-3">
          <!-- Nombre de la empresa -->
          <h1
            class="min-w-0 text-balance wrap-break-word text-2xl font-bold leading-tight tracking-tight text-slate-100 sm:text-3xl"
          >
            {{ supplier().companyName }}
          </h1>
          <!-- Boton Editar proveedor -->
          <button
            type="button"
            (click)="edit.emit()"
            class="inline-flex min-h-10 cursor-pointer touch-manipulation items-center gap-1.5 rounded-lg border border-[#2a3247] bg-[#1a2235] px-3 py-1.5 text-sm font-medium text-slate-300 transition-all duration-150 hover:border-blue-500/50 hover:bg-blue-500/10 hover:text-blue-300 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-400/70 focus-visible:ring-offset-2 focus-visible:ring-offset-[#0f1524] motion-reduce:transition-none motion-safe:active:scale-[0.98] sm:min-h-9"
          >
            <i class="fa-solid fa-pen text-xs" aria-hidden="true"></i>
            Editar
          </button>
          <!-- Boton Eliminar proveedor -->
          <button
            type="button"
            (click)="remove.emit()"
            class="inline-flex min-h-10 cursor-pointer touch-manipulation items-center gap-1.5 rounded-lg border border-red-500/30 bg-red-500/10 px-3 py-1.5 text-sm font-medium text-red-300 transition-all duration-150 hover:border-red-400/60 hover:bg-red-500/20 hover:text-red-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-400/70 focus-visible:ring-offset-2 focus-visible:ring-offset-[#0f1524] motion-reduce:transition-none motion-safe:active:scale-[0.98] sm:min-h-9"
          >
            <i class="fa-solid fa-trash-can text-xs" aria-hidden="true"></i>
            Eliminar
          </button>
        </div>
        <!-- Boton WhatsApp -->
        <whatsapp-button class="self-start" [phoneNumber]="supplier().phoneNumber" />
      </div>
      <!-- Info Saldo Pendiente -->
      <div
        class="flex w-full shrink-0 flex-col items-stretch gap-3 sm:ml-auto sm:w-auto sm:items-end"
      >
        <div
          role="group"
          aria-label="Saldo deudor"
          class="w-full min-w-48 rounded-2xl border border-red-500/25 bg-linear-to-br from-red-500/15 to-red-500/5 px-5 py-3.5 shadow-lg shadow-red-950/20 ring-1 ring-inset ring-red-400/10 sm:w-auto"
        >
          <p
            class="flex items-center gap-2 text-2xl font-bold tabular-nums tracking-tight text-red-300 sm:text-3xl"
          >
            <svg
              aria-hidden="true"
              class="shrink-0 opacity-80"
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
            </svg>
            {{ displayedBalance() | currency: 'ARS' : 'symbol-narrow' : '1.0-0' }}
          </p>
          <p class="mt-1 wrap-break-word text-right text-xs font-medium text-slate-300">
            Saldo deudor total
          </p>
        </div>
      </div>
    </div>
  </section>
</div>

@if (showPaymentModal()) {
  <payment-form-modal
    (cancel)="showPaymentModal.set(false)"
    (saved)="showPaymentModal.set(false); paymentCreated.emit()"
    [currentAccountId]="supplier().currentAccountId"
    [showCashBalance]="true"
  />
}

@if (showPurchaseModal()) {
  <purchase-form-modal
    (cancel)="showPurchaseModal.set(false)"
    (saved)="showPurchaseModal.set(false); purchaseCreated.emit()"
    [currentAccountId]="supplier().currentAccountId"
  />
}
