<div role="status" aria-label="Cargando lista" class="flex flex-col gap-2">
  @for (row of rows; track row) {
    <div
      aria-hidden="true"
      class="flex animate-pulse items-center gap-4 rounded-2xl border border-line bg-panel-from px-4 py-3.5 motion-reduce:animate-none"
      [style.animation-delay.ms]="row * 80"
    >
      <div class="size-12 shrink-0 rounded-full bg-slate-800/80"></div>
      <div class="flex-1 space-y-2.5">
        <div class="h-3.5 w-2/5 rounded-md bg-slate-800/80"></div>
        <div class="h-3 w-1/4 rounded-md bg-slate-800/60"></div>
      </div>
    </div>
  }
</div>
