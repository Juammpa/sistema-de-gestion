<div
  class="flex mt-3 mb-3 flex-col gap-3 rounded-xl border border-slate-800/80 bg-[#0c121e]/90 p-3 shadow-lg backdrop-blur-sm sm:flex-row sm:items-center sm:justify-between"
>
  <!-- Grupo Izquierdo: Buscador y Pestañas de Tipo de Movimiento -->
  <div class="flex flex-1 flex-col gap-3 sm:flex-row sm:items-center">
    <!-- Input de Búsqueda -->
    <div class="relative min-w-65 flex-1 max-w-md">
      <div
        class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500"
      >
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
          />
        </svg>
      </div>
      <input
        type="text"
        placeholder="Buscar por corte, remito o comprobante..."
        class="w-full rounded-lg border border-slate-800 bg-[#0F172A]/70 py-2 pl-10 pr-4 text-xs text-slate-200 placeholder-slate-500 transition-colors focus:border-blue-500 focus:bg-[#0F172A] focus:outline-none focus:ring-1 focus:ring-blue-500"
      />
    </div>

    <!-- Segmented Tabs / Filtros rápidos -->
    <div class="inline-flex items-center rounded-lg border border-slate-800 bg-[#0F172A]/60 p-1">
      <!-- Pestaña Activa: Todos -->
      <button
        type="button"
        class="rounded-md bg-blue-600 px-3 py-1.5 text-xs font-medium text-white shadow-sm transition-colors hover:bg-blue-500 focus:outline-none"
      >
        Todos
      </button>

      <!-- Pestaña: Solo Ventas -->
      <button
        type="button"
        class="rounded-md px-3 py-1.5 text-xs font-medium text-slate-400 transition-colors hover:text-slate-200 focus:outline-none"
      >
        Solo Ventas
      </button>

      <!-- Pestaña: Solo Cobranzas -->
      <button
        type="button"
        class="rounded-md px-3 py-1.5 text-xs font-medium text-slate-400 transition-colors hover:text-slate-200 focus:outline-none"
      >
        Solo Cobranzas
      </button>
    </div>
  </div>

  <!-- Grupo Derecho: Selector de Rango de Fechas y Botón Refrescar -->
  <div class="flex items-center gap-2 self-end sm:self-auto">
    <!-- Selector de Fechas -->
    <button
      type="button"
      class="inline-flex items-center gap-2 rounded-lg border border-slate-800 bg-[#0F172A]/70 px-3 py-2 text-xs font-medium text-slate-300 transition-colors hover:border-slate-700 hover:bg-[#0F172A] hover:text-white focus:outline-none"
    >
      <svg class="h-3.5 w-3.5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
        />
      </svg>
      <span class="font-mono text-[11px] text-slate-200">01/10/2023 - 24/10/2023</span>
    </button>

    <!-- Botón Recargar / Refrescar -->
    <button
      type="button"
      title="Actualizar datos"
      class="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-slate-800 bg-[#0F172A]/70 text-slate-400 transition-colors hover:border-slate-700 hover:bg-[#0F172A] hover:text-slate-200 focus:outline-none"
    >
      <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
        />
      </svg>
    </button>
  </div>
</div>
