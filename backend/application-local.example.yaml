# Local development settings (profile "local", active by default).
#
# Setup: copy this file to backend/src/main/resources/application-local.yaml
# (git-ignored) and replace the values marked with <...>.
# Never commit the real file: it contains secrets.

spring:
  datasource:
    # Port and credentials come from the root .env (POSTGRES_PORT, POSTGRES_USER, POSTGRES_PASSWORD)
    url: jdbc://postgresql://localhost:5433/sistema_gestion
    username: postgres
    password: <POSTGRES_PASSWORD from .env>

  security:
    oauth2:
      resourceserver:
        jwt:
          # Realm URL of the Keycloak started by docker compose
          issuer-uri: http://localhost:8081/realms/sistema-gestion
      client:
        registration:
          keycloak-admin:
            # Secret of the "backend-admin" client: same value as BACKEND_ADMIN_SECRET in .env
            client-secret: <BACKEND_ADMIN_SECRET from .env>

  flyway:
    placeholders:
      # Must be a valid UUID. It only matters when migration V3 runs on a database that already
      # has data: then use the "sub" of your admin user (Keycloak > User > Details > ID).
      initial_owner_id: 11111111-1111-1111-1111-111111111111

  jpa:
    # Optional: prints the SQL statements in the log
    show-sql: true

app:
  cors:
    allowed-origins: http://localhost:4200
  keycloak:
    base-url: http://locahost:8081