<article
  [class]="
    'rounded-2xl border bg-linear-to-br p-5 shadow-md shadow-black/20 ' +
    toneClasses().card
  "
>
  <div class="flex items-center justify-between gap-2">
    <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400">{{ label() }}</h3>
    <span
      aria-hidden="true"
      [class]="'size-2 shrink-0 rounded-full ' + toneClasses().dot"
    ></span>
  </div>

  <p
    class="mt-3 font-mono font-bold tabular-nums tracking-tight text-slate-50"
    [class]="featured() ? 'text-3xl sm:text-4xl' : 'text-xl'"
  >
    {{ value() | currency: 'ARS' : 'symbol-narrow' : '1.0-0' }}
  </p>

  @if (subtitle()) {
    <p class="mt-1 text-xs text-slate-400">{{ subtitle() }}</p>
  }

  @if (trend(); as t) {
    <p class="mt-2 flex items-center gap-1.5 text-xs">
      <span
        [class]="
          'flex items-center gap-1 font-semibold ' + (t.good ? 'text-emerald-400' : 'text-rose-400')
        "
      >
        <i
          aria-hidden="true"
          class="fa-solid text-xs"
          [class.fa-caret-up]="t.up"
          [class.fa-caret-down]="!t.up"
        ></i>
        {{ t.text }}%
      </span>
      <span class="text-slate-400">vs mes anterior</span>
    </p>
  }
</article>
