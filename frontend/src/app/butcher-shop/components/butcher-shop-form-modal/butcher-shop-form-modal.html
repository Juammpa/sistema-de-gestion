<div
  (click)="close()"
  class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/75 p-4 backdrop-blur-md transition-opacity duration-200"
>
  <div
    (click)="$event.stopPropagation()"
    class="relative w-full max-w-lg overflow-hidden rounded-2xl border border-slate-800/90 bg-linear-to-b from-[#131b2e] to-[#0e1626] shadow-2xl shadow-black/80 ring-1 ring-white/10 transition-all duration-200"
  >
    <div
      class="absolute inset-x-0 top-0 h-0.5 bg-linear-to-r from-transparent via-blue-500/50 to-transparent"
    ></div>
    <div
      class="flex items-start justify-between gap-4 border-b border-slate-800/80 px-6 sm:px-7 py-5"
    >
      <div class="flex items-center gap-3.5">
        <span
          class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-linear-to-br from-blue-600/20 to-indigo-600/10 text-blue-400 border border-blue-500/20 shadow-sm shadow-blue-500/10"
        >
          <i class="fa-solid fa-shop text-base"></i>
        </span>
        <div class="space-y-0.5">
          <h2 class="text-lg font-bold tracking-tight text-white">Nueva Sucursal</h2>
          <p class="text-xs text-slate-400">Datos de la sucursal del cliente</p>
        </div>
      </div>
      <button
        type="button"
        (click)="close()"
        class="rounded-xl p-2 cursor-pointer text-slate-400 hover:text-slate-200 hover:bg-slate-800/70 border border-transparent hover:border-slate-700/60 transition-all duration-150 active:scale-95"
        title="Cerrar modal"
      >
        <i class="fa-solid fa-xmark text-sm block"></i>
      </button>
    </div>
    <form [formGroup]="butcherShopForm" (ngSubmit)="onSave()" class="space-y-5 px-6 sm:px-7 py-6">
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <!-- Nombre -->
        <div class="space-y-1.5">
          <label class="block text-xs font-semibold tracking-wider text-slate-300">
            Nombre <span class="text-blue-400">*</span>
          </label>
          <input
            type="text"
            formControlName="name"
            placeholder="Ej. La Pulpería"
            [class.!border-red-500/80]="formUtils.isValidField(butcherShopForm, 'name')"
            [class.!ring-red-500/20]="formUtils.isValidField(butcherShopForm, 'name')"
            class="w-full rounded-xl border border-slate-800 bg-[#0a0f1d] px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 outline-none transition-all duration-150 hover:border-slate-700 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/15"
          />
          @if (formUtils.isValidField(butcherShopForm, 'name')) {
            <span class="flex items-center gap-1.5 text-xs text-red-400 pt-0.5 animate-fadeIn">
              <i class="fa-solid fa-triangle-exclamation text-[11px]"></i>
              {{ formUtils.getFieldError(butcherShopForm, 'name') }}
            </span>
          }
        </div>
        <!-- Dirección -->
        <div class="space-y-1.5">
          <label class="block text-xs font-semibold tracking-wider text-slate-300">
            Dirección <span class="text-blue-400">*</span>
          </label>
          <input
            type="text"
            formControlName="address"
            placeholder="Ej. 8 de Junio 123"
            [class.!border-red-500/80]="formUtils.isValidField(butcherShopForm, 'address')"
            [class.!ring-red-500/20]="formUtils.isValidField(butcherShopForm, 'address')"
            class="w-full rounded-xl border border-slate-800 bg-[#0a0f1d] px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 outline-none transition-all duration-150 hover:border-slate-700 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/15"
          />
          @if (formUtils.isValidField(butcherShopForm, 'address')) {
            <span class="flex items-center gap-1.5 text-xs text-red-400 pt-0.5 animate-fadeIn">
              <i class="fa-solid fa-triangle-exclamation text-[11px]"></i>
              {{ formUtils.getFieldError(butcherShopForm, 'address') }}
            </span>
          }
        </div>
      </div>
      <div class="mt-6 flex items-center justify-end gap-3 border-t border-slate-800/80 pt-5">
        <button
          type="button"
          (click)="close()"
          class="cursor-pointer rounded-xl border border-slate-750/80 bg-slate-800/50 hover:bg-slate-800 px-4 py-2.5 text-xs font-semibold text-slate-300 hover:text-white transition-all duration-150 active:scale-[0.98]"
        >
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="butcherShopForm.invalid"
          class="inline-flex cursor-pointer items-center gap-2 rounded-xl bg-blue-600 hover:bg-blue-500 px-5 py-2.5 text-xs font-semibold text-white shadow-lg shadow-blue-600/20 hover:shadow-blue-600/30 transition-all duration-150 active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-blue-500/50 disabled:cursor-not-allowed disabled:opacity-40 disabled:shadow-none"
        >
          <i class="fa-solid fa-check text-xs"></i> <span>Crear Sucursal</span>
        </button>
      </div>
    </form>
  </div>
</div>
