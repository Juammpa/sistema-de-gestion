<div class="mx-auto flex max-w-6xl flex-col gap-6 px-3 py-4 sm:px-6 sm:py-6">
  <!-- Encabezado -->
  <header>
    <h1 class="text-2xl font-bold tracking-tight text-slate-50">Ajustes</h1>
    <p class="mt-1 text-sm text-slate-400">
      Administrá tu perfil, apariencia y preferencias de la cuenta.
    </p>
  </header>

  <div class="flex flex-col gap-6 md:flex-row md:items-start">
    <!-- Navegación lateral (en celular pasa a ser una fila con scroll) -->
    <nav
      aria-label="Secciones de ajustes"
      class="grid shrink-0 grid-cols-4 gap-1 rounded-2xl border border-slate-800/90 bg-linear-to-b from-panel-from to-panel-to p-2.5 md:sticky md:top-6 md:flex md:w-58 md:flex-col md:gap-0.5"
    >
      @for (section of sections; track section.id) {
        <button
          type="button"
          (click)="selected.set(section.id)"
          [attr.aria-current]="selected() === section.id ? 'page' : null"
          class="flex cursor-pointer flex-col items-center justify-center gap-1.5 whitespace-nowrap rounded-xl px-1 py-2.5 text-xs font-medium md:flex-row md:justify-start md:gap-2.5 md:px-3 md:text-left md:text-sm font-medium text-slate-400 transition-colors duration-150 hover:bg-slate-400/10 hover:text-slate-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-accent-400/70 aria-[current=page]:bg-accent-500/15 aria-[current=page]:text-slate-50 md:w-full"
        >
          <i [class]="section.icon" class="w-5 text-center" aria-hidden="true"></i>
          {{ section.label }}
        </button>
      }
    </nav>

    <!-- Panel de contenido -->
    <section
      class="min-w-0 flex-1 rounded-2xl border border-slate-800/90 bg-linear-to-b from-panel-from to-panel-to p-5 shadow-md shadow-black/20 sm:px-7 sm:py-6"
    >
      @switch (selected()) {
        @case ('profile') {
          <profile-settings />
        }
        @case ('appearance') {
          <appearance-settings />
        }
        @case ('security') {
          <security-settings />
        }
        @case ('account') {
          <account-settings />
        }
      }
    </section>
  </div>
</div>
