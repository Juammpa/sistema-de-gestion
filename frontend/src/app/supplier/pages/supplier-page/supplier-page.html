<!-- Búsqueda y creación de clientes -->
<div
  class="mx-3 mb-6 mt-2 max-w-3xl rounded-2xl border border-slate-800/90 bg-linear-to-b from-panel-from to-panel-to p-5 text-slate-50 shadow-xl shadow-black/40 ring-1 ring-white/5 sm:p-6 md:mx-auto"
>
  <search-input
    placeholder="Buscar proveedores..."
    [numberFound]="suppliers().length"
    searchName="proveedores"
    [filters]="filters"
    (add)="showModal.set(true)"
    (filterChange)="onFilterChange($event)"
    (searchChange)="searchText.set($event)"
  />
</div>

<!-- Lista de proveedores -->
<div
  class="mx-3 flex max-h-[calc(100dvh-11.5rem)] max-w-3xl flex-col gap-3 overflow-y-auto pb-4 scrollbar-none md:mx-auto"
>
  <!-- Mostrar estado de carga -->
  @if (supplierResource.isLoading()) {
    <!-- Cargando (tambien al tocar "Reintentar") -->
    <list-skeleton />
  } @else if (supplierResource.error()) {
    <!-- Error: solo se ve cuando termino de cargar -->
    <error-state
      title="No se pudieron cargar los proveedores"
      [error]="supplierResource.error()"
      (retry)="supplierResource.reload()"
    />
  } @else if (suppliers().length === 0) {
    <empty-state infoMessage="No hay proveedores registrados" />
  } @else if (supplierList().length === 0) {
    <!-- Hay proveedores, pero ninguno coincide con la busqueda -->
    <empty-state
      infoMessage="No se encontraron proveedores con esa búsqueda"
      icon="fa-solid fa-magnifying-glass"
    />
  }

  <!-- Iterar lista de usuarios -->
  <search-list [searchList]="supplierList()" pathRoute="/home/proveedores" />
</div>

<!-- Modal para Agregar Proveedor -->
@if (showModal()) {
  <supplier-form-modal
    animate.leave="modal-host-leave"
    description="Crear Proveedor"
    (cancel)="showModal.set(false)"
    (saved)="showModal.set(false); supplierResource.reload()"
  />
}
