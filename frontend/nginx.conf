server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # index.html es el unico archivo que apunta a los .js/.css con hash: si el navegador lo guardara
    # en cache, despues de un deploy seguiria cargando archivos viejos. "no-cache" no significa
    # "no guardar": significa "preguntar al servidor si cambio antes de usarlo" (respuesta 304, casi gratis)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Angular es una SPA: cualquier ruta (/clientes, /caja...) debe devolver index.html
    # y el router de Angular decide que pantalla mostrar. Sin esto, F5 en /clientes da 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los .js, .css y fuentes llevan un hash en el nombre: pueden cachearse un año sin riesgo,
    # porque si el contenido cambia, el nombre cambia
    location ~* \.(js|css|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Imagenes de public/ (logo, hero): su nombre no cambia, asi que el cache es corto (1 dia)
    # para que un logo nuevo llegue rapido a los usuarios
    location ~* \.(png|webp|ico|svg)$ {
        add_header Cache-Control "public, max-age=86400";
    }
}
