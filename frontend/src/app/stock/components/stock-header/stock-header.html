<section
  class="mx-3 mb-2 mt-2 max-w-3xl rounded-2xl border border-slate-800/90 bg-linear-to-b from-panel-from to-panel-to p-5 shadow-md shadow-black/20 sm:p-6 md:mx-auto"
>
  <div class="flex flex-wrap items-center justify-between gap-x-6 gap-y-5">
    <!-- Título y descripción -->
    <div class="flex min-w-0 items-center gap-3.5">
      <span
        aria-hidden="true"
        class="flex size-11 shrink-0 items-center justify-center rounded-xl border border-accent-500/25 bg-accent-500/15 text-accent-300"
      >
        <i class="fa-solid fa-boxes-stacked text-base"></i>
      </span>
      <div class="min-w-0">
        <h1
          class="text-balance text-xl font-bold leading-tight tracking-tight text-slate-100 sm:text-2xl"
        >
          Stock
        </h1>
        <p class="text-sm text-slate-400">Piezas ingresadas por compras a proveedores</p>
      </div>
    </div>

    <!-- Total del período -->
    <div
      role="group"
      aria-label="Total en stock"
      class="w-full min-w-48 rounded-2xl border border-accent-500/25 bg-linear-to-br from-accent-500/15 to-accent-500/5 px-5 py-3.5 ring-1 ring-inset ring-accent-400/10 sm:ml-auto sm:w-auto"
    >
      <p
        class="flex items-center justify-end gap-2 text-2xl font-bold tabular-nums tracking-tight text-accent-300 sm:text-3xl"
      >
        <i aria-hidden="true" class="fa-solid fa-weight-hanging text-base opacity-80"></i>
        @if (kilograms() != null) {
          {{ kilograms() | number: '1.0-2' }} kg
        } @else {
          <span class="text-slate-400" role="img" aria-label="Total no disponible">—</span>
        }
      </p>
      <p class="mt-1 text-right text-xs font-medium text-slate-300">
        Cant. kilos
        @if (units() != null) {
          · {{ units() }} {{ units() === 1 ? 'pieza' : 'piezas' }}
        }
      </p>
    </div>
  </div>
</section>
