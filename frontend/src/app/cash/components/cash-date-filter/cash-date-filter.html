<!-- Filtro de fechas -->
<div
  class="mx-3 mb-4 max-w-3xl rounded-xl border border-slate-800/90 bg-linear-to-b from-panel-from to-panel-to px-3 py-3 shadow-md shadow-black/20 sm:px-4 sm:py-2.5 md:mx-auto"
>
  <div class="flex flex-wrap items-center gap-x-4 gap-y-3">
    <!-- Rango Desde / Hasta -->
    <div
      role="group"
      aria-label="Rango de fechas"
      class="flex w-full items-end gap-3 sm:w-auto sm:items-center sm:gap-4"
    >
      <div
        class="min-w-0 flex-1 space-y-1 sm:flex sm:flex-none sm:items-center sm:gap-2 sm:space-y-0"
      >
        <label for="cash-from" class="block text-sm font-medium text-slate-300 sm:shrink-0">
          Desde
        </label>
        <input
          id="cash-from"
          type="date"
          [value]="from()"
          (change)="onFromChange($event)"
          class="h-11 w-full cursor-pointer rounded-lg border border-slate-700/70 bg-canvas px-3 text-base tabular-nums text-slate-100 outline-none transition-ui hover:border-slate-600 focus:border-accent-500 focus:ring-4 focus:ring-accent-500/15 motion-reduce:transition-none sm:h-9 sm:text-sm"
        />
      </div>
      <div
        class="min-w-0 flex-1 space-y-1 sm:flex sm:flex-none sm:items-center sm:gap-2 sm:space-y-0"
      >
        <label for="cash-to" class="block text-sm font-medium text-slate-300 sm:shrink-0">
          Hasta
        </label>
        <input
          id="cash-to"
          type="date"
          [value]="to()"
          (change)="onToChange($event)"
          class="h-11 w-full cursor-pointer rounded-lg border border-slate-700/70 bg-canvas px-3 text-base tabular-nums text-slate-100 outline-none transition-ui hover:border-slate-600 focus:border-accent-500 focus:ring-4 focus:ring-accent-500/15 motion-reduce:transition-none sm:h-9 sm:text-sm"
        />
      </div>
    </div>

    <!-- Atajos -->
    <div role="group" aria-label="Atajos de fecha" class="flex w-full gap-2 sm:ml-auto sm:w-auto">
      <button
        type="button"
        (click)="setToday()"
        class="h-11 flex-1 cursor-pointer touch-manipulation rounded-lg border border-line bg-raised px-3.5 text-sm font-medium text-slate-300 transition-ui duration-150 hover:border-accent-500/50 hover:bg-accent-500/10 hover:text-accent-300 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent-400/70 focus-visible:ring-offset-2 focus-visible:ring-offset-panel-to motion-reduce:transition-none motion-safe:active:scale-[0.97] sm:h-9 sm:flex-none"
      >
        Hoy
      </button>
      <button
        type="button"
        (click)="setLastDays(7)"
        class="h-11 flex-1 cursor-pointer touch-manipulation rounded-lg border border-line bg-raised px-3.5 text-sm font-medium text-slate-300 transition-ui duration-150 hover:border-accent-500/50 hover:bg-accent-500/10 hover:text-accent-300 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent-400/70 focus-visible:ring-offset-2 focus-visible:ring-offset-panel-to motion-reduce:transition-none motion-safe:active:scale-[0.97] sm:h-9 sm:flex-none"
      >
        Últimos 7 días
      </button>
    </div>
  </div>
</div>
