<!-- Búsqueda y creación de clientes -->
<div
  class="mx-3 mb-6 mt-2 max-w-3xl rounded-2xl border border-slate-800/90 bg-linear-to-b from-[#161d31] to-[#0f1524] p-5 text-white shadow-xl shadow-black/40 ring-1 ring-white/5 sm:p-6 md:mx-auto"
>
  <search-input
    placeholder="Buscar clientes..."
    [numberFound]="clientResource.value()?.length || 0"
    searchName="clientes"
    [filters]="filters"
    (add)="showModal.set(true)"
    (filterChange)="onFilterChange($event)"
    (searchChange)="searchText.set($event)"
  />
</div>

<!-- Lista de clientes -->
<div
  class="mx-3 flex max-h-107 max-w-3xl flex-col gap-3 overflow-y-auto pb-4 scrollbar-none md:mx-auto"
>
  <!-- Mostrar estado de carga -->
  @if (clientResource.isLoading()) {
    <div class="m-auto">
      <loading-spinner />
    </div>
  }

  <!-- TODO: implementar funcionalidad -->
  <!-- Mostrar estado de error -->
  @if (clientResource.error()) {
    <empty-state infoMessage="No se pudo conectar al servidor" />
  }

  <!-- Mostrar estado sin resultados -->
  @if (
    clientResource.value()?.length === 0 && !clientResource.isLoading() && !clientResource.error()
  ) {
    <empty-state infoMessage="No hay clientes registrados" />
  }

  <!-- Mostrar estado sin resultados de la busqueda -->
  @if (clientResource.value()?.length && clientList().length === 0) {
    <empty-state
      infoMessage="No se encontraron clientes con esa búsqueda"
      icon="fa-solid fa-magnifying-glass"
    />
  }

  <!-- Iterar lista de usuarios -->
  <search-list [searchList]="clientList()" pathRoute="/home/clientes" />
</div>

<!-- Modal para Agregar Cliente -->
@if (showModal()) {
  <client-form-modal
    description="Crear Cliente"
    (cancel)="showModal.set(false)"
    (saved)="showModal.set(false); clientResource.reload()"
  />
}
