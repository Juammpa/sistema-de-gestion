<section
  class="mx-auto mb-2 mt-2 max-w-3xl rounded-2xl border border-slate-800/90 bg-linear-to-b from-[#161d31] to-[#0f1524] p-5 shadow-xl shadow-black/40 ring-1 ring-white/5 sm:p-6"
>
  <div class="flex flex-wrap items-center justify-between gap-x-6 gap-y-5">
    <!-- Título y descripción -->
    <div class="flex min-w-0 items-center gap-3.5">
      <span
        aria-hidden="true"
        class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl border border-blue-500/25 bg-linear-to-br from-blue-600/25 to-indigo-600/10 text-blue-300 shadow-sm shadow-blue-500/10 ring-1 ring-inset ring-white/5"
      >
        <i class="fa-solid fa-vault text-base"></i>
      </span>
      <div class="min-w-0">
        <h1 class="text-balance text-xl font-bold tracking-tight text-slate-100 sm:text-2xl">
          Caja de Ahorro
        </h1>
        <p class="text-xs text-slate-400 sm:text-sm">
          Pagos recibidos por día y efectivo acumulado
        </p>
      </div>
    </div>

    <!-- Saldo actual -->
    <div
      class="w-full min-w-48 rounded-2xl border border-emerald-500/25 bg-linear-to-br from-emerald-500/15 to-emerald-500/5 px-5 py-3.5 shadow-lg shadow-emerald-950/20 ring-1 ring-inset ring-emerald-400/10 sm:ml-auto sm:w-auto"
    >
      <p
        class="flex items-center justify-end gap-2 text-xl font-bold tabular-nums tracking-tight text-emerald-300 sm:text-2xl"
      >
        <i aria-hidden="true" class="fa-solid fa-wallet text-base opacity-80"></i>
        @if (balance() != null) {
          {{ balance() | currency: 'ARS' : 'symbol-narrow' : '1.2-2' }}
        } @else {
          <span class="text-slate-500" aria-label="Saldo no disponible">—</span>
        }
      </p>
      <p class="mt-1 text-right text-xs font-medium text-slate-300/80">Saldo actual</p>
    </div>
  </div>
</section>
