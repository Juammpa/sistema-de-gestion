<div class="shrink-0">
  <!-- Encabezado con saldo actual -->
  <cash-header [balance]="balanceResource.hasValue() ? balanceResource.value() : undefined" />

  <!-- Filtro de fechas -->
  <cash-date-filter [(from)]="from" [(to)]="to" />
</div>

<!-- Un bloque por día -->
<div
  class="mx-3 flex max-w-3xl flex-1 flex-col gap-4 overflow-y-auto pb-4 scrollbar-none md:mx-auto"
>
  <!---->
  @if (cashResource.isLoading()) {
    <div class="m-auto py-12"><loading-spinner /></div>
    <!---->
  } @else if (cashResource.error()) {
    <error-state
      title="No se pudo cargar la caja"
      [error]="cashResource.error()"
      (retry)="cashResource.reload()"
    />
    <!---->
  } @else {
    @for (day of cashResource.value(); track day.date) {
      <cash-item [day]="day" (open)="selectedDay.set(day)" />
      <!---->
    } @empty {
      <empty-state infoMessage="No hay movimientos en el rango seleccionado" />
    }
  }
</div>

@if (selectedDay(); as day) {
  <cash-day-modal animate.leave="modal-host-leave" [day]="day" (cancel)="selectedDay.set(null)" />
}
