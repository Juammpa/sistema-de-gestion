@for (person of searchList(); track person.id) {
  <div
    class="px-3 py-4 mb-2 border-slate-800 border rounded-2xl text-white bg-slate-900 hover:cursor-pointer hover:opacity-90"
  >
    <div class="flex items-center gap-4">
      <!-- Foto -->
      <div class="w-12 h-12 rounded-full bg-blue-400 flex items-center justify-center shrink-0">
        <span class="text-sm font-medium text-white"
          >{{ person.lastName[0] }}{{ person.name[0] }}</span
        >
      </div>

      <!-- Info -->
      <div>
        <p class="text-sm font-medium text-white">{{ person.lastName }} {{ person.name }}</p>
        <p class="text-xs text-slate-400 mt-0.5">{{ person.phoneNumber }}</p>
      </div>
    </div>
  </div>
}
